<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-commerce Product Page</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding: 20px;
      margin: 0;
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
      font-size: 28px;
    }

    /* GRID */
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr); /* 4 items per row */
      gap: 20px;
    }

    /* CARD */
    .card {
      background: white;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      text-align: center;
    }

    .card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 8px;
    }

    .card h3 {
      margin: 10px 0 5px;
      font-size: 18px;
    }

    .card p {
      margin: 5px 0;
      font-size: 14px;
      color: #555;
    }

    .price {
      font-weight: bold;
      color: #007bff;
      font-size: 16px;
    }

    /* RESPONSIVE */
    @media (max-width: 1024px) {
      .grid {
        grid-template-columns: repeat(2, 1fr); /* 2 items per row */
      }
    }

    @media (max-width: 600px) {
      .grid {
        grid-template-columns: 1fr; /* single column */
      }
    }
  </style>
</head>
<body>

<h2>Responsive Product Grid</h2>

<div class="grid">

  <div class="card">
    <img src="https://cpimg.tistatic.com/11455170/b/4/CREATIVE-ELEPHANT-GOLD-BLACK.jpeg" alt="">
    <h3>Product 1</h3>
    <p>High-quality item with great features.</p>
    <p class="price">₹499</p>
  </div>

  <div class="card">
    <img src="https://leoceros.co.in/cdn/shop/files/IMG_9139.jpg?v=1747155969&width=1445" alt="">
    <h3>Product 2</h3>
    <p>Durable and stylish for daily use.</p>
    <p class="price">₹799</p>
  </div>



</body>
</html>
